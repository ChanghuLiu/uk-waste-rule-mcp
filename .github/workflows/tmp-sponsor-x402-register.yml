name: Temporary Sponsor x402 validation and registration

on:
  push:
    branches:
      - ops/x402scan-register-20260925

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Sponsor HTTP x402 and register x402scan
        shell: bash
        run: |
          set -euo pipefail

          echo '=== UNPAID ASSESS ==='
          curl -sS -D /tmp/assess.headers -o /tmp/assess.body             -X POST 'https://works.regevidencehub.com/api/v1/assess-change-impact'             -H 'Content-Type: application/json'             --data '{"event_type":"unauthorised_absence","route":"skilled_worker","consecutive_working_days":11}' || true
          head -n 1 /tmp/assess.headers
          grep -i '^payment-required:' /tmp/assess.headers | head -n 1

          validate() {
            name="$1"
            url="$2"
            echo "=== COINBASE $name ==="
            curl -sS -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate'               -H 'Content-Type: application/json'               --data-binary "$(jq -nc --arg resource "$url" '{resource:$resource,method:"POST"}')"
            echo
          }
          validate assess 'https://works.regevidencehub.com/api/v1/assess-change-impact'
          validate batch 'https://works.regevidencehub.com/api/v1/batch-assess-changes'

          echo '=== X402SCAN REGISTER ==='
          body='{"json":{"origin":"https://works.regevidencehub.com"}}'
          curl -sS             -X POST 'https://www.x402scan.com/api/trpc/public.resources.registerFromOrigin'             -H 'Content-Type: application/json'             -H 'x-trpc-source: nextjs-react'             --data-binary "$body"
          echo
