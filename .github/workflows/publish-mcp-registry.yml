name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc
      - name: Publish remote server metadata
        run: /tmp/mcp-publisher publish ./server.json
      - name: Verify registry listing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --get               --data-urlencode "search=io.github.ChanghuLiu/uk-waste-rule-mcp"               https://registry.modelcontextprotocol.io/v0.1/servers               -o /tmp/registry.json &&               python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/registry.json').read_text())
          for item in payload.get('servers', []):
              server=item.get('server', item)
              if server.get('name') == 'io.github.ChanghuLiu/uk-waste-rule-mcp' and server.get('version') == '0.2.0':
                  print('mcp_registry_listing=PASS')
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then exit 0; fi
            sleep 10
          done
          exit 1
