name: Temporary Waste HTTP telemetry smoke

on:
  push:
    branches:
      - ops/waste-telemetry-smoke-20260926

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read compact Waste payment telemetry
        shell: bash
        run: |
          set -euo pipefail
          curl -sS 'https://waste.regevidencehub.com/metrics' > /tmp/metrics.json
          echo '=== BUSINESS FUNNEL ==='
          jq -c '.windows["24h"].business_funnel' /tmp/metrics.json
          echo '=== PAID CHALLENGE BY TOOL ==='
          jq -c '[.windows["24h"].by_tool[] | select(.event_type=="paid_challenge")]' /tmp/metrics.json
          echo '=== SOURCE TOTALS ==='
          jq -c '.windows["24h"].sources' /tmp/metrics.json
