name: Temporary Waste permit revalidation and registration

on:
  push:
    branches:
      - ops/x402scan-register-20260925

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revalidate Waste permit and register x402scan
        shell: bash
        run: |
          set -euo pipefail
          echo '=== COINBASE permit ==='
          curl -sS -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate'             -H 'Content-Type: application/json'             --data-binary '{"resource":"https://waste.regevidencehub.com/api/v1/waste-permit-change-preflight","method":"POST"}'             | tee /tmp/permit.json
          jq -e '.valid == true and .simulation.outcome == "accepted" and .statusCode == 402' /tmp/permit.json >/dev/null

          echo '=== X402SCAN REGISTER ==='
          body='{"json":{"origin":"https://waste.regevidencehub.com"}}'
          curl -sS             -X POST 'https://www.x402scan.com/api/trpc/public.resources.registerFromOrigin'             -H 'Content-Type: application/json'             -H 'x-trpc-source: nextjs-react'             --data-binary "$body"             | tee /tmp/x402scan.json
          echo
          jq -e '.result.data.json.success == true and .result.data.json.failed == 0 and .result.data.json.registered == 4' /tmp/x402scan.json >/dev/null
