name: Temporary Waste x402 validation and registration

on:
  push:
    branches:
      - ops/x402scan-register-20260925

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate Waste routes and register x402scan
        shell: bash
        run: |
          set -euo pipefail

          validate() {
            name="$1"
            url="$2"
            echo "=== COINBASE $name ==="
            curl -sS -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate' \
              -H 'Content-Type: application/json' \
              --data-binary "$(jq -nc --arg resource "$url" '{resource:$resource,method:"POST"}')" \
              | tee "/tmp/${name}.json"
            echo
            jq -e '.valid == true and .simulation.outcome == "accepted" and .statusCode == 402' "/tmp/${name}.json" >/dev/null
          }

          validate rule 'https://waste.regevidencehub.com/api/v1/waste-rule-preflight'
          validate carrier 'https://waste.regevidencehub.com/api/v1/waste-carrier-broker-dealer-preflight'
          validate tracking 'https://waste.regevidencehub.com/api/v1/waste-digital-tracking-readiness'
          validate permit 'https://waste.regevidencehub.com/api/v1/waste-permit-change-preflight'

          echo '=== X402SCAN REGISTER ==='
          body='{"json":{"origin":"https://waste.regevidencehub.com"}}'
          curl -sS \
            -X POST 'https://www.x402scan.com/api/trpc/public.resources.registerFromOrigin' \
            -H 'Content-Type: application/json' \
            -H 'x-trpc-source: nextjs-react' \
            --data-binary "$body" \
            | tee /tmp/x402scan.json
          echo
          jq -e '.result.data.json.success == true and .result.data.json.failed == 0 and .result.data.json.registered == 4' /tmp/x402scan.json >/dev/null
