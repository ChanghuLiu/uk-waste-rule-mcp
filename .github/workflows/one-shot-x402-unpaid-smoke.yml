name: one-shot x402 unpaid production smoke

on:
  push:
    branches:
      - ops/x402-unpaid-smoke-20260924

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP client
        run: pip install "mcp>=2,<3"
      - name: Verify free discovery and unpaid x402 challenge
        env:
          MCP_URL: https://waste-rule-mcp-production.up.railway.app/mcp
        run: |
          python - <<'PY'
          import asyncio, json, os
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def dump(value):
              md = getattr(value, "model_dump", None)
              if callable(md):
                  try:
                      return md(by_alias=True, exclude_none=True)
                  except TypeError:
                      return md()
              if isinstance(value, dict):
                  return value
              return {"repr": repr(value)}

          async def main():
              async with streamable_http_client(os.environ["MCP_URL"]) as streams:
                  read_stream, write_stream = streams[:2]
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      listed = await session.list_tools()
                      names = {t.name for t in listed.tools}
                      required = {
                          "waste_rule_info",
                          "waste_rule_preflight",
                          "carrier_broker_dealer_registration_preflight",
                          "digital_waste_tracking_receipt_readiness",
                          "permit_change_impact",
                      }
                      assert required <= names, sorted(names)

                      free = await session.call_tool("waste_rule_info", arguments={})
                      free_dump = dump(free)
                      print("FREE_RESULT=", json.dumps(free_dump, default=str)[:4000])
                      assert not bool(free_dump.get("isError") or free_dump.get("is_error"))

                      paid = await session.call_tool(
                          "waste_rule_preflight",
                          arguments={
                              "nation":"England",
                              "role":"receiver",
                              "activities":["receive_waste"],
                              "site_location":"External smoke site",
                              "waste_types":["non_hazardous_general"],
                              "hazardous_status":False,
                              "authorisation_status":"permit",
                          },
                      )
                      paid_dump = dump(paid)
                      print("PAID_UNPAID_RESULT=", json.dumps(paid_dump, default=str)[:8000])
                      assert bool(paid_dump.get("isError") or paid_dump.get("is_error")), paid_dump

                      structured = paid_dump.get("structuredContent") or paid_dump.get("structured_content") or {}
                      serialized = json.dumps(structured, default=str)
                      assert "x402Version" in serialized or "accepts" in serialized, serialized
                      for forbidden in ('"decision"', '"findings"', '"evidence"', '"normalised_input"'):
                          assert forbidden not in serialized, serialized
                      print("X402_UNPAID_CHALLENGE=PASS")
                      print("BUSINESS_RESULT_LEAKAGE=NONE")

          asyncio.run(main())
          PY
