name: one-shot railway credential probe

on:
  push:
    branches:
      - ops/x402-unpaid-smoke-20260924

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway secret availability
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then echo "RAILWAY_TOKEN_PRESENT=true"; else echo "RAILWAY_TOKEN_PRESENT=false"; fi
          if [ -n "$RAILWAY_API_TOKEN" ]; then echo "RAILWAY_API_TOKEN_PRESENT=true"; else echo "RAILWAY_API_TOKEN_PRESENT=false"; fi
