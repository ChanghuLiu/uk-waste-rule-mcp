name: Temporary Waste CDP canary validation

on:
  push:
    branches:
      - ops/waste-cdp-canary-20260926

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live Waste HTTP 402 challenges
        shell: bash
        run: |
          set -euo pipefail

          check_402() {
            name="$1"
            url="$2"
            body="$3"
            echo "=== DIRECT $name ==="
            status="$(curl -sS -D "/tmp/${name}.headers" -o "/tmp/${name}.body" \
              -w '%{http_code}' -X POST "$url" \
              -H 'Content-Type: application/json' \
              --data-binary "$body")"
            echo "status=$status"
            grep -Ei '^(payment-required|x-payment-required|content-type):' "/tmp/${name}.headers" || true
            if [ "$status" != "402" ]; then
              echo "Unexpected status"
              cat "/tmp/${name}.body"
              exit 1
            fi
          }

          check_402 waste_rule_preflight \
            'https://waste.regevidencehub.com/api/v1/waste-rule-preflight' \
            '{"nation":"England","role":"receiver","activities":["receive_waste"],"site_location":"Leeds","waste_types":["mixed controlled waste"],"hazardous_status":false,"authorisation_status":"permit"}'

          check_402 waste_carrier_broker_dealer_preflight \
            'https://waste.regevidencehub.com/api/v1/waste-carrier-broker-dealer-preflight' \
            '{"nation":"England","role":"carrier","action":"new_registration","own_waste_only":false}'

          check_402 waste_digital_tracking_readiness \
            'https://waste.regevidencehub.com/api/v1/waste-digital-tracking-readiness' \
            '{"nation":"England","receiving_authorisation":"permit","receives_controlled_waste":true,"reporting_method_ready":true}'

          check_402 waste_permit_change_preflight \
            'https://waste.regevidencehub.com/api/v1/waste-permit-change-preflight' \
            '{"nation":"England","current":{"maximum_quantity":"10 tonnes"},"proposed":{"maximum_quantity":"20 tonnes"}}'

      - name: Run Coinbase Bazaar validator
        shell: bash
        run: |
          set -euo pipefail

          validate() {
            name="$1"
            url="$2"
            echo "=== VALIDATOR $name ==="
            curl -sS -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate' \
              -H 'Content-Type: application/json' \
              --data-binary "$(jq -nc --arg resource "$url" '{resource:$resource,method:"POST"}')" \
              | tee "/tmp/${name}.json"
            echo
            jq -e '.valid == true and .simulation.outcome == "accepted"' "/tmp/${name}.json" >/dev/null
          }

          validate waste_rule_preflight 'https://waste.regevidencehub.com/api/v1/waste-rule-preflight'
          validate waste_carrier_broker_dealer_preflight 'https://waste.regevidencehub.com/api/v1/waste-carrier-broker-dealer-preflight'
          validate waste_digital_tracking_readiness 'https://waste.regevidencehub.com/api/v1/waste-digital-tracking-readiness'
          validate waste_permit_change_preflight 'https://waste.regevidencehub.com/api/v1/waste-permit-change-preflight'
