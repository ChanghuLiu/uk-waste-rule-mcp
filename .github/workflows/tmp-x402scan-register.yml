name: Temporary x402scan Sponsor and Waste discovery check

on:
  push:
    branches:
      - ops/x402scan-register-20260925

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Sponsor and Waste discovery
        shell: bash
        run: |
          set -euo pipefail
          check() {
            name="$1"
            origin="$2"
            echo "=== $name ==="
            body="$(jq -nc --arg origin "$origin" '{json:{origin:$origin,bustCache:true}}')"
            curl -sS               -X POST 'https://www.x402scan.com/api/trpc/public.resources.checkDiscovery'               -H 'Content-Type: application/json'               -H 'x-trpc-source: nextjs-react'               --data-binary "$body"
            echo
          }
          check sponsor 'https://works.regevidencehub.com'
          check waste 'https://waste.regevidencehub.com'
