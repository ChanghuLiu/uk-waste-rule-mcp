name: PayAI production x402 smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/x402_paid_smoke.py
      - src/uk_waste_rule_mcp/x402_mcp2.py
      - src/uk_waste_rule_mcp/production_bridge.py
      - .github/workflows/payai-production-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install -e '.[mcp]' 'x402[evm]==2.24.0'
      - name: Verify commercial production tool contract
        env:
          WASTE_PAID_MCP_URL: https://waste.regevidencehub.com/mcp
        run: |
          python - <<'PY'
          import asyncio, os
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          endpoint=os.environ["WASTE_PAID_MCP_URL"]
          expected=[
              "waste_service_info",
              "waste_rule_catalog",
              "waste_source_status",
              "waste_source_audit",
              "waste_source_registry",
              "waste_rule_preflight",
              "waste_carrier_broker_dealer_preflight",
              "waste_digital_tracking_readiness",
              "waste_permit_change_preflight",
          ]
          async def main():
              async with streamable_http_client(endpoint) as streams:
                  async with ClientSession(streams[0], streams[1]) as session:
                      await session.initialize()
                      result=await session.list_tools()
                      names=[tool.name for tool in result.tools]
                      assert names == expected, {"expected":expected,"actual":names}
                      print("WASTE_PRODUCTION_TOOL_CONTRACT=PASS", names)
          asyncio.run(main())
          PY
      - name: Verify branded production unpaid challenge
        env:
          WASTE_PAID_MCP_URL: https://waste.regevidencehub.com/mcp
        run: python scripts/x402_paid_smoke.py --probe
      - name: Verify Bazaar endpoint responds
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://facilitator.payai.network/discovery/resources?type=mcp&limit=100'
          with urllib.request.urlopen(url,timeout=30) as r: data=json.load(r)
          endpoint='https://waste.regevidencehub.com/mcp'
          items=data.get('items') or data.get('resources') or []
          matches=[]
          for x in items:
              if not isinstance(x,dict): continue
              resource=x.get('resource')
              if isinstance(resource,dict): resource=resource.get('url')
              if str(resource or '').rstrip('/')==endpoint.rstrip('/'): matches.append(x)
          report={'production_mcp':'PASS','payment_enforced':True,'network':'eip155:8453','unpaid_business_handler_blocked':True,'payai_bazaar_reachable':True,'payai_bazaar_endpoint_present':bool(matches),'payai_bazaar_match_count':len(matches)}
          open('/tmp/payai-production-smoke.json','w').write(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste-payai-production-smoke
          path: /tmp/payai-production-smoke.json
          retention-days: 14
