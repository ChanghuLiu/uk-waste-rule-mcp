name: Temporary x402-list Taxi submission

on:
  push:
    branches:
      - ops/x402-list-submit-taxi-20260925

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit RegEvidenceHub Taxi to x402-list
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {
            "url": "https://taxi.regevidencehub.com",
            "email": "dev@axions.app",
            "service_name": "RegEvidenceHub Taxi",
            "description": "Evidence-linked deterministic England taxi and private-hire licensing preflight and cross-authority comparison for agents, with live x402 payments on Base USDC.",
            "website_url": "https://taxi.regevidencehub.com",
            "category": "Verification",
            "endpoints": ["/api/v1/preflight", "/api/v1/compare"],
            "notes": "OpenAPI 3.1: https://taxi.regevidencehub.com/openapi.json. POST /api/v1/preflight is $0.02 USDC; POST /api/v1/compare is $0.05 USDC. Branded custom domain."
          }
          JSON

          status="$(curl -sS             -o /tmp/response.json             -w '%{http_code}'             -X POST 'https://x402-list.com/api/v1/submit'             -H 'Content-Type: application/json'             --data-binary @/tmp/payload.json)"
          cat /tmp/response.json
          echo
          echo "HTTP_STATUS=$status"
          case "$status" in
            2??) ;;
            *) exit 1 ;;
          esac
