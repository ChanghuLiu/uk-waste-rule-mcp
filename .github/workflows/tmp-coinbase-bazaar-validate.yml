name: Temporary Coinbase Bazaar validation

on:
  push:
    branches:
      - ops/coinbase-bazaar-validate-20260925

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate RegEvidenceHub paid HTTP routes with Coinbase Bazaar
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            name="$1"
            url="$2"
            method="$3"
            echo "=== $name ==="
            curl -sS -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate' \
              -H 'Content-Type: application/json' \
              --data-binary "$(jq -nc --arg resource "$url" --arg method "$method" '{resource:$resource,method:$method}')" \
              | tee "/tmp/${name}.json"
            echo
          }

          validate taxi_preflight 'https://taxi.regevidencehub.com/api/v1/preflight' POST
          validate taxi_compare 'https://taxi.regevidencehub.com/api/v1/compare' POST
          validate cqc_registration_scope 'https://cqc.regevidencehub.com/api/v1/registration-scope-preflight' POST
          validate cqc_statutory_notification 'https://cqc.regevidencehub.com/api/v1/statutory-notification-preflight' POST
          validate premises_preflight 'https://premises.regevidencehub.com/api/v1/preflight' POST
          validate premises_compare 'https://premises.regevidencehub.com/api/v1/compare' POST

          echo '=== SUMMARY ==='
          for f in /tmp/*.json; do
            jq -c '{file:input_filename, valid, simulation, preflight, bazaarExtension, errorType, errorMessage}' "$f"
          done
