name: Temporary clean cohort gate check

on:
  push:
    branches:
      - ops/paid-challenge-breakdown-20260926

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read clean human-offer cohort gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://mcp-commercial-funnel-production.up.railway.app/api/commercial-funnel?window=7d"
          req=urllib.request.Request(url,headers={"User-Agent":"regevidencehub-p0-audit/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          print("generated_at",data.get("generated_at"))
          for product in data.get("products",[]):
              if product.get("id") not in {"taxi","england_works_watch","cqc","premises"}:
                  continue
              human=product.get("experiment_human_funnel") or product.get("human_offer_funnel") or {}
              exp=product.get("experiment") or {}
              stages=human.get("stages") or {}
              compact={}
              for name in ("landing","qualified_commercial_intent","checkout_requested","payment_succeeded"):
                  row=stages.get(name) or {}
                  compact[name]={k:row.get(k) for k in ("observed","included","confirmed_external","unknown","automated_external_excluded","owner_test_excluded")}
              print(product.get("id"),json.dumps({
                  "since":human.get("since"),
                  "experiment_baseline":human.get("experiment_baseline") or product.get("experiment_baseline"),
                  "experiment":exp,
                  "stages":compact,
              },separators=(",",":"),sort_keys=True))
          PY
