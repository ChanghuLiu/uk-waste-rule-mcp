name: Temporary final P0 measurement verification

on:
  push:
    branches:
      - ops/paid-challenge-breakdown-20260926

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read compact final P0 metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://mcp-commercial-funnel-production.up.railway.app/api/commercial-funnel?window=24h"
          req=urllib.request.Request(url,headers={"User-Agent":"regevidencehub-p0-audit/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          stages=data["portfolio"]["stages"]
          print("PORTFOLIO",json.dumps({
              "generated_at":data.get("generated_at"),
              "discovery":stages["discovery"],
              "free_business_call":stages["free_business_call"],
              "paid_challenge":stages["paid_challenge"],
              "paid_executed":stages["paid_executed"],
              "repeat_paid":stages["repeat_paid"],
          },separators=(",",":"),sort_keys=True))
          for product in data.get("products",[]):
              if product.get("id") in {"taxi","england_works_watch","cqc","premises","waste"}:
                  print("PRODUCT",product["id"],json.dumps({
                      "paid_challenge":product["stages"]["paid_challenge"],
                      "paid_executed":product["stages"]["paid_executed"],
                      "attribution":[r for r in product.get("attribution",[]) if r.get("paid_challenge") or r.get("owner_test_paid_challenge")],
                  },separators=(",",":"),sort_keys=True))
          PY
