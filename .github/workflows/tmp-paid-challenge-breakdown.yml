name: Temporary post-patch attribution verification

on:
  push:
    branches:
      - ops/paid-challenge-breakdown-20260926

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read compact product and dashboard attribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"regevidencehub-p0-audit/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          cqc=get("https://cqc.regevidencehub.com/metrics")
          w=cqc.get("windows",{}).get("24h",{})
          print("CQC",json.dumps({
              "paid_challenges":w.get("paid_challenges"),
              "source_attribution":[x for x in w.get("source_attribution",[]) if x.get("event_type")=="paid_challenge"],
          },separators=(",",":"),sort_keys=True))

          prem=get("https://premises.regevidencehub.com/metrics")
          p=prem.get("x402_conversion",{}).get("24h",{})
          print("PREMISES",json.dumps({
              "outcomes":p.get("outcomes"),
              "source_attribution":p.get("source_attribution") or p.get("attribution") or [],
          },separators=(",",":"),sort_keys=True))

          dash=get("https://mcp-commercial-funnel-production.up.railway.app/api/commercial-funnel?window=24h")
          for product in dash.get("products",[]):
              if product.get("id") in {"taxi","cqc","premises"}:
                  rows=[r for r in product.get("attribution",[]) if r.get("paid_challenge")]
                  print("DASH",product.get("id"),json.dumps(rows,separators=(",",":"),sort_keys=True))
          PY

# rerun after mcp-product-console 4c87 deployment
