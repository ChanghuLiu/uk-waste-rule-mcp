name: Temporary dashboard attribution check

on:
  push:
    branches:
      - ops/paid-challenge-breakdown-20260926

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read dashboard attribution only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://mcp-commercial-funnel-production.up.railway.app/api/commercial-funnel?window=24h"
          req=urllib.request.Request(url,headers={"User-Agent":"regevidencehub-p0-audit/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          print("generated_at",data.get("generated_at"))
          for product in data.get("products",[]):
              if product.get("id") not in {"taxi","england_works_watch","cqc","premises","waste"}:
                  continue
              print("===",product.get("id"),"===")
              for row in product.get("attribution",[]):
                  if row.get("paid_challenge") or row.get("paid_executed"):
                      print(json.dumps(row,separators=(",",":"),sort_keys=True))
          PY
