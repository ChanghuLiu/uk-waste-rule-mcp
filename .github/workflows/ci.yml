name: Waste production CI

on:
  push:
    branches: [main, "prod/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mcp,dev]' 'x402[evm]==2.21.0'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Build production Docker image
        run: docker build -t uk-waste-rule-mcp:ci .
